<div
  #cameraViewContainer
  style="width: 100%; height: 40vh"
></div>
<div style="max-width: 500px; margin: 10px auto; text-align: left">
  <h3>Inventory ({{items.length}} unique, {{totalScans}} total scans)</h3>
  <button (click)="clearItems()" style="margin: 8px 0; padding: 6px 12px; cursor: pointer">Clear</button>
  @if (items.length === 0) {
    <p style="color: #999">Scan barcodes to add to inventory.</p>
  } @else {
    <table style="width: 100%; border-collapse: collapse">
      <thead>
        <tr style="border-bottom: 2px solid #333">
          <th style="text-align: left; padding: 6px">#</th>
          <th style="text-align: left">Barcode</th>
          <th>Format</th>
          <th>Count</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items; track item.text; let i = $index) {
          <tr style="border-bottom: 1px solid #eee">
            <td style="padding: 6px">{{i + 1}}</td>
            <td style="font-family: monospace">{{item.text}}</td>
            <td style="text-align: center">{{item.format}}</td>
            <td style="text-align: center">{{item.count}}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
