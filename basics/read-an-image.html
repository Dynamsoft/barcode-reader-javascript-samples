<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="description" content="Read barcodes from an image with Dynamsoft Barcode Reader." />
  <meta name="keywords" content="barcode, image" />
  <link rel="canonical" href="https://demo.dynamsoft.com/Samples/DBR/JS/basics/read-an-image.html" />
  <title>Dynamsoft Barcode Reader Sample - Hello World (Read an Image)</title>

  <script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.6.6000/dist/dbr.bundle.js"></script>
  <!-- If the network is unstable or you prefer to self-host the SDK, uncomment the line below to load it locally -->
  <!-- <script src="../../dist/dbr.bundle.js"></script> -->
</head>

<body>
  <h1>Hello World (Read an Image)</h1>
  <input id="input-file" type="file" accept=".jpg,.jpeg,.icon,.gif,.svg,.webp,.png,.bmp,.pdf" />
  <button id="sample-image" type="button">Try a sample image</button>
  <span id="decoding" role="status"></span>
  <br />
  Results:<br />
  <div id="results"></div>
  <canvas id="preview-canvas" style="display: none; max-width: 100%; max-height: 60vh; margin-top: 12px; border: 1px solid #ddd;"></canvas>
  <script>
    // Configure the WASM engine to include PDF support.
    Dynamsoft.Core.CoreModule.wasmLoadOptions = {
      wasmType: Dynamsoft.Core.EnumWasmType.ML_SIMD_WITH_PDF,
    };
    /** LICENSE ALERT - README
     * To use the library, you need to first specify a license key.
     *
     * You can visit https://www.dynamsoft.com/customer/license/trialLicense?utm_source=samples&product=dbr&package=js to get your own trial license good for 30 days.
     * Note that if you downloaded this sample from Dynamsoft while logged in, the above license key may already be your own 30-day trial license.
     * For more information, see https://www.dynamsoft.com/barcode-reader/docs/web/programming/javascript/user-guide/index.html#license&utm_source=samples or contact support@dynamsoft.com.
     * LICENSE ALERT - THE END
     */
    Dynamsoft.License.LicenseManager.initLicense("DLS2eyJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSJ9");

    // Optional. Preload the deep-learning models required for barcode localization and decoding.
    // If models are not preloaded, it will be lazy-loaded when they are used, resulting in slower first decoding.
    const MODELS = ["OneDLocalization", "DataMatrixQRCodeLocalization", "Code128Decoder", "EAN13Decoder", "Code39ITFDecoder"];
    Dynamsoft.CVR.CaptureVisionRouter.appendDLModelBuffer(MODELS);

    const resultsContainer = document.querySelector("#results");
    const fileInput = document.querySelector("#input-file");
    const sampleImageButton = document.querySelector("#sample-image");
    const decodingStatus = document.querySelector("#decoding");
    const previewCanvas = document.querySelector("#preview-canvas");
    const previewCtx = previewCanvas.getContext("2d");
    let currentObjectUrl = null;

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = currentObjectUrl;
      });
    }

    function drawImageAndHighlights(img, barcodeResultItems = []) {
      previewCanvas.width = img.naturalWidth;
      previewCanvas.height = img.naturalHeight;
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      previewCtx.drawImage(img, 0, 0);
      previewCanvas.style.display = "block";

      if (!barcodeResultItems.length) return;

      const lineWidth = Math.max(2, Math.round(Math.max(img.naturalWidth, img.naturalHeight) / 300));
      previewCtx.lineWidth = lineWidth;
      previewCtx.strokeStyle = "#00e500";
      previewCtx.fillStyle = "rgba(0, 229, 0, 0.18)";

      for (const item of barcodeResultItems) {
        const points = item.location?.points;
        if (!points || points.length < 4) continue;
        previewCtx.beginPath();
        previewCtx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          previewCtx.lineTo(points[i].x, points[i].y);
        }
        previewCtx.closePath();
        previewCtx.fill();
        previewCtx.stroke();
      }
    }

    const pInit = (async () => {
      const cvRouter = await Dynamsoft.CVR.CaptureVisionRouter.createInstance();

      return { cvRouter }
    })();

    async function decodeImage(file) {
      if (sampleImageButton.disabled) return;
      fileInput.disabled = sampleImageButton.disabled = true;
      resultsContainer.innerText = "";
      previewCanvas.style.display = "none";
      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      try {
        if (!file) {
          decodingStatus.textContent = "Loading sample image...";
          if (location.protocol === "file:") {
            throw new Error("Open this page through a local web server (e.g. localhost) to try the sample image.");
          }
          const response = await fetch("../assets/materials/read-an-image.png");
          if (!response.ok) throw new Error(`Could not load the sample image (HTTP ${response.status}).`);
          file = await response.blob();
        }

        decodingStatus.textContent = "Decoding...";
        const { cvRouter } = await pInit;
        const pImg = file.type !== "application/pdf" ? loadImage(file).then((img) => {
          drawImageAndHighlights(img);
          return img;
        }) : Promise.resolve(null);

        const pResult = file.type === "application/pdf"
          ? cvRouter.captureMultiPages(file, "ReadBarcodes_ReadRateFirst").then((pages) => pages[0])
          : cvRouter.capture(file, "ReadBarcodes_ReadRateFirst");
        const [result, img] = await Promise.all([pResult, pImg]);
        const barcodeResultItems = result.decodedBarcodesResult?.barcodeResultItems;
        if (img) {
          drawImageAndHighlights(img, barcodeResultItems || []);
        }

        if (!barcodeResultItems || !barcodeResultItems.length) {
          resultsContainer.innerText += "No barcode found\n";
          return;
        }

        for (let item of barcodeResultItems) {
          resultsContainer.innerText += item.text + "\n";
          console.log(item.text);
        }
      } catch (ex) {
        let errMsg = ex.message || ex;
        console.error(ex);
        alert(errMsg);
      } finally {
        decodingStatus.textContent = "";
        fileInput.disabled = sampleImageButton.disabled = false;
      }
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      fileInput.value = "";
      if (file) void decodeImage(file);
    });
    sampleImageButton.addEventListener("click", () => void decodeImage());
  </script>
</body>

</html>
