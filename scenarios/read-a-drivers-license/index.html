<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="description" content="Instantly Read PDF417 barcodes on Driver Licenses with Dynamsoft Barcode Reader." />
  <meta name="keywords" content="read driver license barcode" />
  <link rel="canonical" href="https://demo.dynamsoft.com/Samples/DBR/JS/scenarios/read-a-drivers-license/index.html" />
  <title>Dynamsoft Barcode Reader Sample - Read a Driver's License</title>
</head>

<body>
  <!-- <script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.6.3000/dist/dbr.bundle.js"></script> -->
  <script src="https://npm.scannerproxy.com:802/cdn/@dynamsoft/dynamsoft-capture-vision-bundle@3.6.3000-dev-20260827143257/dist/dcv.bundle.js"></script>
  <!-- If the network is unstable or you prefer to self-host the SDK, uncomment the line below to load it locally -->
  <!-- <script src="../../../dist/dbr.bundle.js"></script> -->
  <script>

    Dynamsoft.License.LicenseManager.initLicense("DLS2eyJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSJ9");
    (async () => {
      const cameraView = await Dynamsoft.DCE.CameraView.createInstance('./driver-license.ui.xml');
      const cameraEnhancer = await Dynamsoft.DCE.CameraEnhancer.createInstance(cameraView);
      
      const cvRouter = await Dynamsoft.CVR.CaptureVisionRouter.createInstance();

      cvRouter.setInput(cameraEnhancer);

      const uiElement = cameraView.getUIElement();

      cameraView.uiContext = {
        ...cameraView.uiContext,
        cvRouter,
        onDriverLicenseResult: (result)=>{
          console.log(result);
        }
      };

      document.body.append(uiElement);
    })();
  </script>
</body>

</html>
